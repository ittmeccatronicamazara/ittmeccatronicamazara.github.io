<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITT Meccatronica Mazara - Stazione di Foratura</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 20px;
            text-align: center;
        }
        .container {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 650px;
            text-align: center;
        }
        .grid-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 15px;
        }
        .btn {
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-full {
            grid-column: span 2;
        }
        .btn-green {
            background-color: #10b981;
        }
        .btn-green:hover {
            background-color: #059669;
        }
        .btn-blue {
            background-color: #3b82f6;
        }
        .btn-blue:hover {
            background-color: #2563eb;
        }
        .btn-purple {
            background-color: #8b5cf6;
        }
        .btn-purple:hover {
            background-color: #7c3aed;
        }
        #log-box {
            margin-top: 20px;
            background-color: #0f172a;
            color: #38bdf8;
            padding: 15px;
            border-radius: 6px;
            height: 130px;
            overflow-y: auto;
            text-align: left;
            font-family: monospace;
            font-size: 13px;
            border: 1px solid #334155;
        }
    </style>
</head>
<body>

    <h1>ITT Meccatronica - Controllo Remoto</h1>

    <div class="container">
        <h2>Stazione di Foratura (Arduino Wi-Fi)</h2>
        
        <div class="grid-buttons">
            <button id="btn-ciclo" class="btn btn-green btn-full">AVVIA CICLO COMPLETO</button>
            <button id="btn-sensore" class="btn btn-purple btn-full">VERIFICA SENSORE</button>
            
            <button id="btn-uscita" class="btn btn-blue">Uscita Braccio</button>
            <button id="btn-rotazione" class="btn btn-blue">Rotazione Braccio</button>
            <button id="btn-abbassa" class="btn btn-blue">Abbassa Braccio</button>
            <button id="btn-pinza" class="btn btn-blue">Chiudi Pinza</button>
            <button id="btn-foratura" class="btn btn-blue">Attiva Foratura</button>
            <button id="btn-ruotapinza" class="btn btn-blue">Ruota Pinza</button>
        </div>

        <div id="log-box">Pronto per l'invio dei comandi all'Arduino (IP: 10.55.227.170)...<br></div>
    </div>

    <script>
        const arduinoIP = "10.55.227.170";

        function logMessage(msg) {
            const logBox = document.getElementById('log-box');
            const timestamp = new Date().toLocaleTimeString();
            logBox.innerHTML += `[${timestamp}] ${msg}<br>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        function inviaComando(endpoint, nomeComando) {
            logMessage(`Invio: ${nomeComando}...`);
            
            const url = `http://${arduinoIP}${endpoint}`;
            
            // Metodo dell'immagine invisibile per aggirare i blocchi del browser verso la rete locale
            const img = new Image();
            img.src = url + "?t=" + new Date().getTime();
            
            logMessage(`Comando ${nomeComando} inviato con successo!`);
        }

        document.getElementById('btn-ciclo').addEventListener('click', () => {
            inviaComando('/cmd/left', 'Avvio Ciclo Completo');
        });
        document.getElementById('btn-sensore').addEventListener('click', () => {
            inviaComando('/sensor/check', 'Verifica Sensore Passante');
        });
        document.getElementById('btn-uscita').addEventListener('click', () => {
            inviaComando('/cmd/uscita', 'Uscita Braccio');
        });
        document.getElementById('btn-rotazione').addEventListener('click', () => {
            inviaComando('/cmd/rotazione', 'Rotazione Braccio');
        });
        document.getElementById('btn-abbassa').addEventListener('click', () => {
            inviaComando('/cmd/abbassa', 'Abbassa Braccio');
        });
        document.getElementById('btn-pinza').addEventListener('click', () => {
            inviaComando('/cmd/pinza', 'Chiudi Pinza');
        });
        document.getElementById('btn-foratura').addEventListener('click', () => {
            inviaComando('/cmd/foratura', 'Attiva Foratura');
        });
        document.getElementById('btn-ruotapinza').addEventListener('click', () => {
            inviaComando('/cmd/ruotapinza', 'Ruota Pinza');
        });
    </script>

</body>
</html>
