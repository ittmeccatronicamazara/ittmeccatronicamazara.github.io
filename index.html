<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITT Meccatronica Mazara - Stazione di Foratura</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 30px;
        }
        .container {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 15px 0;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-green {
            background-color: #10b981;
        }
        .btn-green:hover {
            background-color: #059669;
        }
        .btn-blue {
            background-color: #3b82f6;
        }
        .btn-blue:hover {
            background-color: #2563eb;
        }
        #log-box {
            margin-top: 20px;
            background-color: #0f172a;
            color: #38bdf8;
            padding: 15px;
            border-radius: 6px;
            height: 150px;
            overflow-y: auto;
            text-align: left;
            font-family: monospace;
            font-size: 14px;
            border: 1px solid #334155;
        }
    </style>
</head>
<body>

    <h1>ITT Meccatronica - Controllo Remoto</h1>

    <div class="container">
        <h2>Stazione di Foratura (Arduino Wi-Fi)</h2>
        
        <button id="btn-ciclo" class="btn btn-green">AVVIA CICLO COMPLETO</button>
        <button id="btn-sensore" class="btn btn-blue">VERIFICA SENSORE</button>

        <div id="log-box">Pronto per l'invio dei comandi all'Arduino (IP: 10.55.227.170)...<br></div>
    </div>

    <script>
        const arduinoIP = "10.55.227.170";

        function logMessage(msg) {
            const logBox = document.getElementById('log-box');
            const timestamp = new Date().toLocaleTimeString();
            logBox.innerHTML += `[${timestamp}] ${msg}<br>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        function inviaComando(endpoint, nomeComando) {
            logMessage(`Invio: ${nomeComando}...`);
            
            const url = `http://${arduinoIP}${endpoint}`;
            
            fetch(url, { mode: 'no-cors' })
                .then(() => {
                    logMessage(`Comando ${nomeComando} inviato con successo all'Arduino!`);
                })
                .catch(err => {
                    logMessage(`Errore di rete o blocco browser su ${nomeComando}`);
                });
        }

        document.getElementById('btn-ciclo').addEventListener('click', () => {
            inviaComando('/cmd/left', 'Avvio Ciclo Completo');
        });

        document.getElementById('btn-sensore').addEventListener('click', () => {
            inviaComando('/sensor/check', 'Verifica Sensore Passante');
        });
    </script>

</body>
</html>
