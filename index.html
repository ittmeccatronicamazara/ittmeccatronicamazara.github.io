<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HMI Stazione di Foratura</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #333; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 25px; }
        button { font-size: 16px; font-weight: bold; padding: 15px; cursor: pointer; border: none; border-radius: 8px; color: white; transition: background 0.2s, transform 0.1s; }
        button:active { transform: scale(0.98); }
        .btn-seq { background-color: #007bff; grid-column: 1 / -1; font-size: 18px; padding: 18px; }
        .btn-seq:hover { background-color: #0056b3; }
        .btn-cmd { background-color: #28a745; }
        .btn-cmd:hover { background-color: #218838; }
        .btn-sensor { background-color: #17a2b8; }
        .btn-sensor:hover { background-color: #138496; }
        #status-box { background: #e9ecef; padding: 15px; border-radius: 8px; font-size: 1.1em; color: #495057; border-left: 5px solid #007bff; text-align: left; font-family: monospace; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Controllo Stazione di Foratura</h1>
        
        <div class="grid">
            <button class="btn-seq" onclick="inviaComando('left')">Esegui Ciclo Completo (Staz. Foratura)</button>
            <button class="btn-cmd" onclick="inviaComando('uscita')">Uscita Braccio (D)</button>
            <button class="btn-cmd" onclick="inviaComando('rotazione')">Rotazione Braccio (A)</button>
            <button class="btn-cmd" onclick="inviaComando('abbassa')">Abbassa Braccio (B)</button>
            <button class="btn-cmd" onclick="inviaComando('pinza')">Chiusura Pinza (C)</button>
            <button class="btn-cmd" onclick="inviaComando('foratura')">Attiva Foratura (H)</button>
            <button class="btn-cmd" onclick="inviaComando('ruotapinza')">Ruota Pinza (E)</button>
            <button class="btn-sensor" onclick="verificaSensore()">Verifica Sensore Passante</button>
        </div>

        <h3>Log di Stato / Risposta:</h3>
        <div id="status-box">Pronto per l'invio comandi...</div>
    </div>

    <script>
        function inviaComando(cmd) {
            document.getElementById('status-box').innerText = "Invio comando '" + cmd + "' in corso...";
            fetch('/cmd/' + cmd, { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    document.getElementById('status-box').innerText = "Risposta Arduino: " + JSON.stringify(data, null, 2);
                })
                .catch(error => {
                    document.getElementById('status-box').innerText = "Errore di connessione: " + error;
                });
        }

        function verificaSensore() {
            document.getElementById('status-box').innerText = "Interrogazione sensore in corso...";
            fetch('/sensor/check', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    document.getElementById('status-box').innerText = "Sensore: " + JSON.stringify(data, null, 2);
                })
                .catch(error => {
                    document.getElementById('status-box').innerText = "Errore di connessione: " + error;
                });
        }
    </script>

</body>
</html>
